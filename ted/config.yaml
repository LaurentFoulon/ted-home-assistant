# Application Home Assistant TED (anciennement « module complémentaire »).
# Modèle : build_addon.py y inscrit la version de TED et l'image publique.
# Home Assistant télécharge l'image Docker de TED (code compilé, Intel/AMD et
# ARM64) : ni code ni Dockerfile ici. version = étiquette de l'image.
name: TED Energy Pilot
version: "3.4"
image: "tedenergy/ted"
slug: ted
description: >-
  Pilote vos onduleurs et batteries solaires depuis Home Assistant pour
  consommer votre propre production.
url: https://ted-energy.fr/installation/home-assistant
arch:
  - aarch64
  - amd64
startup: application
boot: auto
# Accès à Home Assistant par le Supervisor (jeton fourni automatiquement).
homeassistant_api: true
# Lecture du port réseau choisi par l'utilisateur (page Application mobile de TED).
hassio_api: true
# Interface dans la barre latérale de Home Assistant.
ingress: true
ingress_port: 8099
panel_icon: mdi:solar-power
panel_title: TED
# Accès direct sur le réseau local (application mobile, accès à distance).
ports:
  5000/tcp: 5001
ports_description:
  5000/tcp: Interface web directe et application mobile TED
# Données de TED dans addon_configs/<application> (partage Samba, sauvegardes).
map:
  - addon_config:rw
# Journaux (20 à 30 Mo par jour) : hors des sauvegardes de Home Assistant.
backup_exclude:
  - logs
  - logs/*
watchdog: "http://[HOST]:[PORT:5000]/health"
options:
  verbose_log: false
  log_retention_days: 14
schema:
  verbose_log: bool
  log_retention_days: int(1,365)
